name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --verbose
      - name: Test
        run: make test
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Flake checks
        run: nix flake check
      - name: Nix build
        run: nix build

  # the compatibility tests need a corpus that is not in the repo and an nvim to
  # evaluate it, so they get their own job rather than a matrix entry. It runs
  # against upstream's current main, which is what makes a config people rely on
  # breaking show up here rather than in an issue.
  efmls-configs:
    name: efmls-configs compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Test against the current efmls-configs
        run: nix develop .#ci --command make test-efmls
